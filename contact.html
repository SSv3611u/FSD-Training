<!doctype html>
<html lang="en" data-bs-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact | CampusBridge</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css"></head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">CB</span> CampusBridge</a><button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="registration.html">Registration</a></li><li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li><li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li><li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li></ul></div></div></nav>
  <main class="py-5"><div class="container">
    <div class="row g-4">
      <div class="col-lg-5"><h1>Contact Us</h1><p class="text-body-secondary">Send a message to the student support office.</p><div class="alert alert-success d-none" id="contactAlert" role="alert">Message sent successfully.</div><p><strong>Address:</strong> CampusBridge College, Hyderabad</p><p><strong>Email:</strong> support@campusbridge.edu</p></div>
      <div class="col-lg-7">
        <form id="contactForm">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" required></div>
            <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" required></div>
            <div class="col-12"><label class="form-label">Subject</label><input class="form-control" required></div>
            <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" rows="5" required></textarea></div>
          </div>
          <button class="btn btn-primary mt-3" type="submit">Send Message</button>
        </form>
      </div>
    </div>
  </div></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script>
</body></html>
